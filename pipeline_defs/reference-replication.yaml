name: reference-replication
version: "0.5"
description: Full reference replication workflow from reference analysis through footage matching, exact timeline, draft rendering, GPT semantic QC, revision routing, and QC-gated final delivery.
category: custom
stability: beta
default_checkpoint_policy: guided
reference_input:
  supported: true
  analysis_depth: deep
  analysis_tools:
    - reference_blueprint_builder
stages:
  - name: analyze
    skill: pipelines/reference-replication/analyze-director
    produces:
      - reference_blueprint
    required_tools:
      - reference_blueprint_builder
    optional_tools:
      - frame_sampler
      - scene_detect
      - transcriber
    tools_available:
      - reference_blueprint_builder
      - frame_sampler
      - scene_detect
      - transcriber
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Produces a schema-valid reference_blueprint artifact
      - Semantic enrichment is complete
      - Choreography action order is explicit

  - name: footage
    skill: pipelines/reference-replication/footage-director
    required_artifacts_in:
      - reference_blueprint
    produces:
      - footage_profiles
    required_tools:
      - footage_profile_builder
    optional_tools:
      - frame_sampler
      - scene_detect
    tools_available:
      - footage_profile_builder
      - frame_sampler
      - scene_detect
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Produces a schema-valid footage_profiles artifact
      - semantic_enrichment_required is false
      - At least one usable footage segment exists
      - No local AI dependency is introduced

  - name: match
    skill: pipelines/reference-replication/match-director
    required_artifacts_in:
      - reference_blueprint
      - footage_profiles
    produces:
      - reference_matching
    required_tools:
      - reference_candidate_ranker
      - reference_match_validator
    optional_tools:
      - frame_sampler
    tools_available:
      - reference_candidate_ranker
      - reference_match_validator
      - frame_sampler
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Produces a schema-valid reference_matching artifact
      - matched_segment_count equals reference_segment_count
      - full_coverage is true
      - Every fallback has an improvement request

  - name: timeline
    skill: pipelines/reference-replication/timeline-director
    required_artifacts_in:
      - reference_blueprint
      - reference_matching
    produces:
      - replication_timeline
    required_tools:
      - reference_timeline_builder
    optional_tools: []
    tools_available:
      - reference_timeline_builder
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Produces a schema-valid replication_timeline artifact
      - Timeline starts at zero and ends at the reference duration
      - No unintended gaps or overlaps exist
      - full_coverage and timeline_contiguous are true
      - No render runtime is silently selected

  - name: render
    skill: pipelines/reference-replication/render-director
    required_artifacts_in:
      - reference_blueprint
      - replication_timeline
    produces:
      - replication_render_plan
      - draft_render
    required_tools:
      - reference_render_plan_builder
      - reference_video_renderer
      - video_compose
    optional_tools: []
    tools_available:
      - reference_render_plan_builder
      - reference_video_renderer
      - video_compose
    checkpoint_required: true
    human_approval_default: true
    success_criteria:
      - Produces a schema-valid replication_render_plan artifact
      - runtime_approved is true
      - Produces a complete draft_render artifact
      - Rendered duration stays within technical tolerance of the Phase 3 timeline
      - Phase 2 fallbacks remain represented rather than dropped

  - name: qc
    skill: pipelines/reference-replication/qc-director
    required_artifacts_in:
      - reference_blueprint
      - reference_matching
      - replication_timeline
      - replication_render_plan
      - draft_render
    produces:
      - replication_qc_evidence
      - replication_qc
      - final_render
    required_tools:
      - replication_qc_evidence_builder
      - reference_qc_validator
      - reference_finalizer
    optional_tools:
      - reference_match_validator
      - reference_timeline_builder
      - reference_render_plan_builder
      - reference_video_renderer
    tools_available:
      - replication_qc_evidence_builder
      - reference_qc_validator
      - reference_finalizer
      - reference_match_validator
      - reference_timeline_builder
      - reference_render_plan_builder
      - reference_video_renderer
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - GPT compares every reference segment against paired draft evidence
      - FidelityScore and QualityScore remain separate
      - Fixable defects route back to match, timeline, or render before finalization
      - Missing source footage becomes a concrete improvement request, not a timeline hole
      - No local LLM, VLM, or CLIP dependency performs semantic QC
    success_criteria:
      - Produces schema-valid replication_qc_evidence and replication_qc artifacts
      - QC status is pass or publishable footage_limited
      - No fixable revision_actions remain
      - final_decision.publishable is true
      - final_decision.requires_rerender is false
      - reference_finalizer produces renders/final.mp4

extensions:
  custom_scripts: false
  custom_playbooks: false
  custom_skills: true
  custom_tools: true
metadata:
  phase: 5
  core_workflow_complete: true
  phase_1_contract: schemas/artifacts/reference_blueprint.schema.json
  footage_contract: schemas/artifacts/footage_profiles.schema.json
  phase_2_contract: schemas/artifacts/reference_matching.schema.json
  phase_3_contract: schemas/artifacts/replication_timeline.schema.json
  phase_4_contract: schemas/artifacts/replication_render_plan.schema.json
  qc_evidence_contract: schemas/artifacts/replication_qc_evidence.schema.json
  output_contract: schemas/artifacts/replication_qc.schema.json
  draft_render_path: renders/draft.mp4
  final_render_path: renders/final.mp4
